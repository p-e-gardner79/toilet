}

function drawInterface(now,w,h){
 const H=Math.max(4.7,5*h/w),X=H*w/h;uiCamera.left=-X;uiCamera.right=X;uiCamera.top=H;uiCamera.bottom=-H;uiCamera.updateProjectionMatrix();

 hit('f-start',0,-H*.58,4.4,1);hit('f-menu-music',0,-H*.82,3.7,.65);

  flushModel.position.y=-H*.73;flushTop.position.z=kick>.2?-.05:.03;flushWords.position.z=kick>.2?.15:.23;

 }
