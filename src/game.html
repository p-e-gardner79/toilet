  if(a.fall&&!a.landed){a.vy-=dt*7;a.o.position.y+=a.vy*dt;a.o.position.z+=dt*(.65+Math.abs(a.home.x)*.15);a.o.rotation.x+=dt*2.6;a.o.rotation.z+=dt*(a.home.x<0?-.6:.6);if(a.o.position.y<=.12){a.o.position.y=.10+Math.abs(a.home.x)*.005;a.o.rotation.x=Math.PI/2;a.landed=true;}}

 }
 if(audio&&wind){wind.gain.setTargetAtTime(active&&document.visibilityState!=='hidden'?.035+pressure*.07:0,audio.currentTime,.2);}
 if(active&&now>=nextTrump){trumpet();nextTrump=now+1700-Math.min(1,amount)*1050;}

}
function animate(now){

 const desired=state==='playing'?Math.min(1,taps/target):0;pressure+=(desired-pressure)*Math.min(1,dt*8);kick=Math.max(0,kick-dt*7);

 skin.color.setHex(0xefb078).lerp(new THREE.Color(0xe85f53),pressure*.62);

 for(let i=0;i<2;i++){

  pupils[i].position.set(s*.31+(reduced.matches?0:Math.sin(t*(8+i*5)+i*2)*pressure*.09),.18+(reduced.matches?0:Math.cos(t*(11+i*3))*pressure*.075),.752+pressure*.06);
  pupils[i].scale.setScalar(relief?.7:1-pressure*.3);

 }
 mouth.scale.set(1+pressure*.22,relief?1.65:1+pressure*.85,1);mouth.rotation.z=relief?0:Math.sin(t*20)*pressure*.03;

 if(state==='playing'&&pressure>.12&&!reduced.matches){emit+=dt;if(emit>.1-pressure*.055){emit=0;for(const s of [-1,1]){puff(s*.095,-.23,.92,s*.65,pressure);if(pressure>.35)puff(s*.96,.02,.07,s*2.3,pressure);}}}
 for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.age+=dt;const u=p.age/p.life;if(u>=1){face.remove(p.o);p.o.material.dispose();steam.splice(i,1);continue;}p.o.position.x+=p.dx*dt;p.o.position.y+=p.dy*dt;p.o.position.z+=p.dz*dt;p.o.scale.setScalar(.04+u*p.size);p.o.material.opacity=.7*(1-u);}
 bathroom(dt,t,now);renderer.render(scene,camera);
}requestAnimationFrame(animate);
}catch(error){const message=q('#f-loading')||q('#f-caption');message.textContent='The 3D scene could not load. Reopen this preview with WebGL and CDN access enabled.';message.setAttribute('role','alert');}
